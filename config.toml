theme="blackCurrent" # fork of fleet dark
# theme="fleet_dark"
# theme="chocolate"
# theme="jetbrains_dark"

[editor]
scrolloff = 0 # leave 1 to see decorator attached and stuff
mouse = false # but we can still scroll yay!
middle-click-paste = false # this is the most horrible thing ever...
scroll-lines=2 # default 3
line-number = "relative" # or keep absolute..
cursorline = true # default : false... nande ??
cursorcolumn=false # default false
continue-comments=true # default true
# gutters = ["diff","line-numbers","spacer","diagnostics","spacer"]
# gutters = ["diff","line-numbers","spacer"] # hate when the gutter gets really big
gutters = ["diff","diagnostics","line-numbers","spacer"] # hate when the gutter gets really big
auto-completion=true
path-completion=true
auto-format=true
idle-timeout=250 # default 250
preview-completion-insert=true
completion-replace=true # default false
auto-info=true
completion-trigger-len = 1 # default 2
completion-timeout=5 # default 250, use 5 for instant
bufferline = "multiple" # always, multiple, never | use always so that we can get away without putting the file path in the statuline
# workspace-lsp-roots = []
insert-final-newline=true# default true
atomic-save=true # keep this true
trim-final-newlines=true# default false
trim-trailing-whitespace=true # default false
color-modes = true
enable-diagnostics = false #default true
# popup-border = "all"
end-of-line-diagnostics = "disable"
# inline-diagnostics.cursor-line = "disable"

# [editor.inline-diagnostics]
# cursor-line="disable"
# other-lines="disable"

[editor.soft-wrap]
# do this in languages.toml file if needed
enable = false

[editor.whitespace.render]
nbsp = "all"
nnbsp = "all"
space = "none" # there is no settings for trailing whitespaces :(

[editor.indent-guides]
render = true
character = "▏" # Some characters that work well: "▏", "┆", "┊", "⸽"
# character = "┆" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 0

[editor.lsp]
enable = true
snippets = true
display-inlay-hints = true
auto-signature-help = true
display-progress-messages=true

[editor.statusline.mode]
insert = "Insert"
normal = "Normal"
select = "Select"

[editor.statusline]
left = ["mode","spinner","version-control"]
center = ["file-base-name"]
right = ["diagnostics","spacer","position-percentage","spacer","selections"]
merge-with-commandline = true

[keys.normal]
";" = ["repeat_last_motion"]
# Muscle memory
# {} have no conflicts..
"{" = ["goto_prev_paragraph","extend_to_line_bounds"]
"}" = ["goto_next_paragraph"]
# 0 = "goto_first_nonwhitespace"
# "$" = "goto_line_end"
# usually x does not extend
x = ["select_mode", "extend_to_line_bounds"]
# Escape the madness! No more fighting with the cursor! Or with multiple cursors!
esc = ["collapse_selection", "keep_primary_selection"]

[keys.normal."]"]
"]" = ":buffer-next"
[keys.normal."["]
"[" = ":buffer-previous"


[keys.normal."-"]
"e" = "file_explorer_in_current_buffer_directory"
"f" = "file_picker_in_current_buffer_directory"
"t" = {l = ":theme rose_pine_dawn", c=":theme chocolate", b =":theme blackCurrent",j = ":theme jetbrains_dark"}
"F" = ":format"
"-" = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]
x = ":buffer-close"
w = ":w"
q = {b =":buffer-close!", q = ":qa!", w=":wq"}
v = ":vsplit"
h = ":hsplit"
c = {o =":config-open", r = ":config-reload"}
g = [":vsplit-new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
d = [":toggle-option enable-diagnostics"]
# d = {d=":toggle inline-diagnostics.cursor-line disable", w = ":toggle inline-diagnostics.cursor-line warning", e = ":toggle inline-diagnostics.cursor-line error"}

[keys.insert]
"C-tab" = ["completion"]

[keys.select]
"q" = [":reflow","collapse_selection","goto_first_nonwhitespace"]
"{" = ["goto_prev_paragraph","extend_to_line_bounds"]
"}" = ["extend_to_line_bounds", "goto_next_paragraph"]

# ~ in helix
# u = ["switch_to_lowercase", "collapse_selection", "normal_mode"]
# U = ["switch_to_uppercase", "collapse_selection", "normal_mode"]

# Make selecting lines in visual mode behave sensibly
# without this it selects after or before the home line
k = ["extend_line_up", "extend_to_line_bounds"]
j = ["extend_line_down", "extend_to_line_bounds"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
