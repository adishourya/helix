# Fleet Max Bill Light

# A warm, restrained light theme inspired by the

# eggshell dial and minimalist typography of Junghans Max Bill.

"attribute" = "Lime"

"type" = "Blue"
"type.return" = "Blue Light"
"type.parameter" = "Blue Light"
"constructor" = "Yellow"

"constant" = "Violet"
"constant.builtin.boolean" = "Cyan"
"constant.character" = "Yellow"
"constant.character.escape" = "Cyan"
"constant.numeric" = "Yellow"
"string" = "Green"
"string.regexp" = "Cyan"
"string.special" = { fg = "Blue", modifiers = ["underlined"] }

"comment" = "Gray 70"
"variable" = "Gray 120"
"variable.builtin" = { fg = "Coral" }
"variable.other.member" = "Violet"
"label" = "Yellow"

"keyword" = "Blue"
"function" = "Yellow"
"function.declaration" = "Gray 120"
"function.macro" = "Lime"
"function.builtin" = "Lime"
"function.special" = "Lime"

"tag" = "Blue"
"special" = "Lime"
"namespace" = "Blue"

# Markup

"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.heading" = { fg = "Blue", modifiers = ["bold"] }
"markup.list" = "Coral"
"markup.list.numbered" = "Blue"
"markup.list.unnumbered" = "Blue"
"markup.link.url" = { fg = "Pink", modifiers = ["italic", "underlined"] }
"markup.link.text" = "Blue"
"markup.link.label" = "Violet"
"markup.quote" = "Gray 70"
"markup.raw" = "Green"
"markup.raw.inline" = "Cyan"
"markup.raw.block" = "Green"

# Diff

"diff.plus" = "Green"
"diff.minus" = "Red"
"diff.delta" = "Blue"

# UI

"ui.background" = { bg = "Eggshell" }
"ui.statusline" = { fg = "Gray 120", bg = "Surface" }
"ui.statusline.normal" = { fg = "Gray 120", bg = "Surface Active" }
"ui.statusline.inactive" = { fg = "Gray 70", bg = "Surface" }
"ui.statusline.insert" = { fg = "Eggshell", bg = "Blue" }
"ui.statusline.select" = { fg = "Eggshell", bg = "Violet" }

"ui.virtual.indent-guide" = "Gray 30"

"ui.bufferline" = { fg = "Gray 70", bg = "Eggshell" }
"ui.bufferline.active" = { bg = "Eggshell", fg = "Blue" }

"ui.virtual.jump-label" = { fg = "Eggshell", bg = "Blue" }
"ui.picker.header.column" = "Blue Light"
"ui.picker.header.column.active" = "Blue"

"ui.cursor" = { modifiers = ["reversed"] }
"ui.cursor.match" = { bg = "Selection Soft" }
"ui.selection" = { bg = "Selection" }
"ui.selection.primary" = { bg = "Selection Primary" }

"ui.cursorline" = { bg = "Cursorline" }
"ui.linenr" = "Gray 60"
"ui.linenr.selected" = "Gray 120"

"ui.popup" = { fg = "Gray 120", bg = "Surface" }
"ui.window" = { fg = "Gray 40" }
"ui.help" = { fg = "Gray 120", bg = "Surface" }
"ui.menu" = { fg = "Gray 120", bg = "Surface" }
"ui.menu.selected" = { fg = "Eggshell", bg = "Blue" }
"ui.menu.scroll" = { fg = "Gray 50" }

"ui.text" = "Gray 120"
"ui.text.focus" = { fg = "Eggshell", bg = "Blue" }

"ui.virtual" = "Gray 60"
"ui.virtual.inlay-hint" = { fg = "Gray 70" }
"ui.virtual.ruler" = { bg = "Surface" }

# Diagnostics

"hint" = "Gray 70"
"info" = "Violet"
"warning" = "Yellow"
"error" = "Red"

"diagnostic.hint" = { underline = { color = "Gray 70", style = "curl" } }
"diagnostic.info" = { underline = { color = "Violet", style = "curl" } }
"diagnostic.warning" = { underline = { color = "Yellow", style = "curl" } }
"diagnostic.error" = { underline = { color = "Red", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

